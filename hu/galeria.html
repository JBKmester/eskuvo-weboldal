<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria | Esküvőnk</title>
    <link rel="stylesheet" href="../resources/style.css">
</head>
<body>

    <div class="lang-switcher">
        <span class="active">HU</span> | <a href="#">EN</a>
    </div>

    <div class="gallery-container">
        <h1 class="gallery-title">Köszönjük, hogy eljöttetek!</h1>
        <p class="gallery-subtitle">Amennyiben van nektek is jó képetek, akkor itt tudjátok elküldeni nekünk :)</p>

        <div class="upload-section">
            <label for="file-upload" class="custom-upload-btn">
                <span class="upload-icon">📸</span> Képek kiválasztása
            </label>
            <input type="file" id="file-upload" accept="image/*" multiple style="display: none;">
            <p class="upload-info">Egyszerre több kép is kiválasztható</p>
        </div>

        <div class="image-grid">
        </div>

        <script src="../resources/galeria.js"></script>
    </div>

</body>
</html>
